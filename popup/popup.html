<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Hubbuy Dark Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="mark" src="../icons/icon128.png" alt="" aria-hidden="true">
    <div class="titles">
      <h1>Hubbuy Dark Mode</h1>
      <p id="status" class="status">carregando…</p>
    </div>
  </header>

  <label class="row row--main" for="enabled">
    <span class="row-label">Modo escuro</span>
    <input type="checkbox" id="enabled" class="switch">
    <span class="switch-ui" aria-hidden="true"></span>
  </label>

  <div class="group">
    <label class="row" for="followSystem">
      <span class="row-text">
        <span class="row-label">Seguir o tema do sistema</span>
        <span class="row-hint">Claro quando o Windows estiver no modo claro</span>
      </span>
      <input type="checkbox" id="followSystem" class="switch">
      <span class="switch-ui" aria-hidden="true"></span>
    </label>

    <label class="row" for="dimMedia">
      <span class="row-text">
        <span class="row-label">Suavizar imagens</span>
        <span class="row-hint">Reduz o brilho de banners; volta ao normal ao passar o mouse</span>
      </span>
      <input type="checkbox" id="dimMedia" class="switch">
      <span class="switch-ui" aria-hidden="true"></span>
    </label>
  </div>

  <!-- Fora do grupo acima porque funciona mesmo com o tema escuro desligado. -->
  <div class="group group--standalone">
    <label class="row" for="hideBanner">
      <span class="row-text">
        <span class="row-label">Ocultar banner do topo</span>
        <span class="row-hint">Remove a faixa promocional acima do menu</span>
      </span>
      <input type="checkbox" id="hideBanner" class="switch">
      <span class="switch-ui" aria-hidden="true"></span>
    </label>
  </div>

  <footer class="foot">
    <span id="scope">Ativo em hubbuy.com</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
